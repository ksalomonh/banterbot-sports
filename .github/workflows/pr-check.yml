name: PR Validation

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

jobs:
  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR links an issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issuePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const matches = [...body.matchAll(issuePattern)];
            if (matches.length === 0) {
              core.setFailed(
                '❌ PR must reference an approved issue.\n' +
                'Add "Closes #N", "Fixes #N", or "Resolves #N" to the PR body.\n' +
                'See .agent/skills/branch-pr/SKILL.md for the workflow.'
              );
            } else {
              core.info(`✅ Found issue reference(s): #${matches.map(m => m[1]).join(', ')}`);
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    needs: check-issue-reference
    steps:
      - name: Verify linked issue is approved
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const issuePattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const matches = [...body.matchAll(issuePattern)];
            const failures = [];
            for (const match of matches) {
              const issueNumber = parseInt(match[1], 10);
              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                failures.push(`Issue #${issueNumber}: could not be fetched (${err.message})`);
                continue;
              }
              const labels = issue.labels.map(l => l.name);
              if (!labels.includes('status:approved')) {
                failures.push(
                  `Issue #${issueNumber} ("${issue.title}") does not have \`status:approved\`. ` +
                  `A maintainer must approve it before merging.`
                );
              } else {
                core.info(`✅ Issue #${issueNumber} has status:approved`);
              }
            }
            if (failures.length > 0) {
              core.setFailed('❌ ' + failures.join('\n'));
            }

  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR has exactly one type label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const typeLabels = pr.labels.map(l => l.name).filter(l => l.startsWith('type:'));
            if (typeLabels.length === 0) {
              core.setFailed(
                '❌ PR must have exactly one type:* label.\n' +
                'Valid: type:bug, type:feature, type:docs, type:refactor, type:chore, type:breaking-change'
              );
            } else if (typeLabels.length > 1) {
              core.setFailed(`❌ PR has multiple type:* labels: ${typeLabels.join(', ')}. Keep exactly one.`);
            } else {
              core.info(`✅ PR has type label: ${typeLabels[0]}`);
            }
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore dependencies
        run: |
          if ls *.sln 1>/dev/null 2>&1; then
            dotnet restore
          else
            echo 'No solution file yet — skipping restore'
          fi
      - name: Build
        run: |
          if ls *.sln 1>/dev/null 2>&1; then
            dotnet build --no-incremental --no-restore
          else
            echo 'No solution file yet — skipping build'
          fi
      - name: Test
        run: |
          if ls *.sln 1>/dev/null 2>&1; then
            dotnet test --no-build --verbosity normal
          else
            echo 'No solution file yet — skipping tests'
          fi
