name: Bug Report
description: Report a bug in BanterBot Sports
labels: ["bug", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        > **Workflow:**
        > 1. Submit issue → gets `status:needs-review`
        > 2. Maintainer reviews → adds `status:approved`
        > 3. Only then can a PR be opened

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I understand this needs `status:approved` before a PR can be opened
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: What happened? Include error messages and unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Layer
      options:
        - BanterBotSports.Web
        - BanterBotSports.BL
        - BanterBotSports.DAL
        - BanterBotSports.Entities
        - BanterBotSports.BanterAI
        - BanterBotSports.Integrations
        - GitHub Actions / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      render: text
