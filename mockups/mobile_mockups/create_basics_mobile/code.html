                        "on-secondary": "#0b5800",
                        "on-tertiary-fixed": "#3a0002",
                        "on-surface": "#e1e4fa",
                        "surface-variant": "#1e253b",
                        "primary-dim": "#00c0ea",
                        "on-error": "#490006",
                        "tertiary-container": "#f5282b",
                        "primary": "#69daff",
                        "surface-tint": "#69daff",
                        "secondary-fixed-dim": "#2be800",
                        "on-surface-variant": "#a6aabf",
                        "on-error-container": "#ffa8a3",

            },

<style>
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0d1323]/60 backdrop-blur-xl shadow-[0_4px_40px_0_rgba(105,218,255,0.08)]">
<div class="flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#69daff] text-2xl" data-icon="sports_kabaddi">sports_kabaddi</span>
<span class="text-xl font-black tracking-tighter text-[#69daff] italic">BANTERBOT</span>
</div>
<div class="w-10 h-10 rounded-full border-2 border-primary/20 overflow-hidden">
<img alt="User avatar" class="w-full h-full object-cover" data-alt="Close up professional portrait of a gamer with neon blue lighting highlights and futuristic aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBbiN6_vRThXhdOm6_Ghrfujy4kkh0I4guwMIl31hQi-0bu4_MhhNinKMsIiepkVm-i_ZhH85dC34GsKpgAFoh88ahvXXdskiePQyLGEN4ObwnUla5exp9Dc8AJ-Drflp5N2O4hbFahzGsaRLjkApKJqO-54bPOU3072UiignmFbDP04to9GalXt_jKDj2DBETZYoIogkdbMl1IKVNy903coCCj2BttmcKUDKUCWHggYVwS2QW6b7clt_nXbeKto03AtIwyOb6d_xw4"/>
</div>
</div>
</header>
<main class="pt-24 px-6 max-w-md mx-auto">
<!-- Wizard Header -->
<div class="mb-8">
<div class="flex items-center gap-2 mb-2">
<span class="text-secondary text-[10px] font-bold tracking-[0.2em] uppercase">Step 01 of 03</span>
<div class="flex-1 h-[2px] bg-surface-container-highest rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-secondary shadow-[0_0_8px_#2ff801]"></div>
</div>
</div>
<h1 class="text-3xl font-black text-on-surface tracking-tight uppercase italic leading-none">Create Tournament</h1>
<p class="text-on-surface-variant text-sm mt-2">Set up the digital colosseum for your next league battle.</p>
</div>
<!-- Form Section -->
<div class="space-y-8">
<!-- Image Upload Area -->
<div class="relative group">
<label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-3">Tournament Banner</label>
<div class="w-full aspect-[21/9] rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant/30 flex flex-col items-center justify-center overflow-hidden transition-all hover:border-primary/50 group-active:scale-[0.98]">
<div class="text-center p-6">
<span class="material-symbols-outlined text-4xl text-primary/40 mb-2" data-icon="add_a_photo">add_a_photo</span>
<p class="text-xs font-medium text-on-surface/60">Upload Cover Image</p>
<p class="text-[10px] text-on-surface-variant mt-1">1200x500px recommended</p>
</div>
<!-- Decorative background element for image slot -->
<div class="absolute inset-0 -z-10 opacity-10 bg-gradient-to-br from-primary to-transparent"></div>
</div>
</div>
<!-- Inputs -->
<div class="space-y-6">
<!-- Tournament Name -->
<div class="space-y-2">
<label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider" for="tourney-name">Tournament Name</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-1 focus:ring-primary/30 transition-all text-sm font-medium" id="tourney-name" placeholder="e.g., Weekend Warriors Cup" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/40 text-lg" data-icon="edit">edit</span>
</div>
</div>
<!-- Entry Fee Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider" for="entry-fee">Entry Fee</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-bold text-sm">$</span>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-8 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-1 focus:ring-primary/30 transition-all text-sm font-medium" id="entry-fee" placeholder="0.00" type="number"/>
</div>
</div>
<!-- POST-MVP — IGNORAR: el toggle "Privacy: Public" no se implementa en MVP.
     En MVP todos los torneos son privados (solo accesibles via invite link).
     La opción de torneos públicos/descubribles es una idea para post-MVP.
     Ver PRD.md § Decisiones de Diseño — Resueltas, decisión #5. -->
<div class="space-y-2">
<label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Privacy</label>
<button class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-4 text-left flex justify-between items-center group">
<span class="text-sm font-medium text-on-surface">Public</span>
<span class="material-symbols-outlined text-primary text-lg" data-icon="public">public</span>
</button>
</div>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider" for="description">Description</label>
<textarea class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-1 focus:ring-primary/30 transition-all text-sm font-medium resize-none" id="description" placeholder="Briefly describe the rules and prizes..." rows="4"></textarea>
</div>
</div>
<!-- Tips Card -->
<div class="p-5 rounded-xl bg-surface-container-low border border-outline-variant/10 relative overflow-hidden">
<div class="relative z-10 flex gap-4">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="lightbulb">lightbulb</span>
</div>
<div>
<h4 class="text-xs font-bold text-primary uppercase tracking-wide">Pro Tip</h4>
<p class="text-xs text-on-surface-variant leading-relaxed mt-1">High-quality banners increase player participation by up to 45%. Choose something dynamic!</p>
</div>
</div>
<!-- Ambient Glow Background -->
<div class="absolute -right-8 -bottom-8 w-24 h-24 bg-primary/5 blur-3xl rounded-full"></div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Contextual) -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-background via-background/95 to-transparent z-40">
<button class="w-full h-16 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center gap-3 shadow-[0_0_30px_rgba(105,218,255,0.2)] active:scale-95 transition-transform">
<span class="text-on-primary-container font-black uppercase tracking-widest italic text-sm">Next Step</span>
<span class="material-symbols-outlined text-on-primary-container text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Hidden Bottom Nav (Suppressed for focused task per rule: "hide the shell to prioritize the Canvas") -->
<!-- But we include the logic for the shell if needed, currently commented out per "Automatic Suppression" rule -->

    <nav class="fixed bottom-0 w-full z-50 rounded-t-[2rem] bg-[#0d1323]/60 backdrop-blur-xl shadow-[0_-4px_40px_0_rgba(105,218,255,0.08)] md:hidden">
        <div class="flex justify-around items-center h-20 pb-safe px-4 w-full">
            ... nav items ...
        </div>
    </nav>

</body></html>
