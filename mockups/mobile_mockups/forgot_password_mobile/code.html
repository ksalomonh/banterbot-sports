<div class="w-full max-w-md mb-12 relative">
<div class="absolute inset-0 bg-primary opacity-5 blur-[80px] rounded-full"></div>
<div class="relative z-10 text-center">
<span class="material-symbols-outlined text-primary text-7xl mb-4" style="font-variation-settings: 'wght' 200;">lock_reset</span>
<h1 class="text-[3.5rem] leading-none font-black tracking-tight text-on-surface uppercase mb-4 font-headline">
                    Lost your <br/><span class="text-primary">entry?</span>
</h1>
<p class="text-on-surface-variant text-lg max-w-[280px] mx-auto">
                    Even the MVPs forget their playbooks. Let's get you back in the game.
                </p>
</div>
</div>
<!-- Forgot Password Card -->
<div class="w-full max-w-md bg-surface-container-low p-8 rounded-full stadium-glow border-none transition-all duration-300">
<form action="#" class="space-y-8">
<div>
<label class="block text-[0.75rem] font-bold tracking-[0.05em] uppercase text-primary mb-3" for="email">
                        Stadium Registered Email
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-1 focus:ring-primary/20 focus:bg-surface-bright transition-all" id="email" name="email" placeholder="coach@banterbot.live" required="" type="email"/>
</div>
</div>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-black py-4 rounded-xl uppercase tracking-widest text-sm shadow-lg shadow-primary/10 hover:brightness-110 active:scale-95 transition-all" type="submit">
                    Send Recovery Link
                </button>
</form>
<div class="mt-8 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-on-surface-variant text-sm mb-4">
                    Remembered your pass?
                </p>
<a class="inline-flex items-center gap-2 text-primary font-bold uppercase tracking-wider text-xs hover:gap-3 transition-all" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
