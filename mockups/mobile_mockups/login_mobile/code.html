<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-high": "#181f33",
              "on-surface-variant": "#a6aabf",
              "on-error": "#490006",

              "error": "#ff716c",
              "on-error-container": "#ffa8a3",

              "secondary-container": "#106e00",
              "inverse-surface": "#faf8ff",
              "secondary-dim": "#2be800",
              "background": "#090e1c",
              "primary-fixed-dim": "#00c0ea",
              "surface-tint": "#69daff",
              "surface-bright": "#242b43",
              "on-tertiary": "#4a0003",
              "outline": "#707588",
              "on-primary": "#004a5d",
              "tertiary-dim": "#e51a22",
              "primary": "#69daff",
              "on-secondary-container": "#e7ffd9",
              "error-dim": "#d7383b",
              "on-secondary-fixed": "#064200",
              "on-tertiary-container": "#000000",
              "on-primary-fixed-variant": "#004a5c",
              "primary-fixed": "#00cffc",
              "primary-dim": "#00c0ea",
              "tertiary-container": "#f5282b",
              "on-primary-container": "#004050",
              "secondary-fixed": "#2ff801",
              "surface": "#090e1c",
              "on-background": "#e1e4fa",
              "tertiary-fixed-dim": "#ff7b70",
              "surface-variant": "#1e253b",
              "inverse-primary": "#006880",
              "on-primary-fixed": "#002a35",
              "error-container": "#9f0519",
              "secondary": "#2ff801",
              "tertiary": "#ff7166",
              "outline-variant": "#434759",
              "surface-container": "#13192b",
              "surface-container-highest": "#1e253b",
              "on-secondary": "#0b5800",
              "surface-container-lowest": "#000000",
              "on-secondary-fixed-variant": "#0d6200",
              "primary-container": "#00cffc",
              "tertiary-fixed": "#ff9287",
              "on-tertiary-fixed": "#3a0002"

            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-stadium-gradient {
            background: radial-gradient(circle at top, #181f33 0%, #090e1c 100%);
        }
        .neon-glow-primary {
            box-shadow: 0 0 20px rgba(105, 218, 255, 0.2);
        }
        .glass-panel {
            background: rgba(30, 37, 59, 0.6);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center p-0 m-0 overflow-x-hidden">
<!-- Top Navigation Anchor (Suppressing shell as per transactional rule, but keeping brand presence) -->
<header class="w-full fixed top-0 z-50 flex items-center justify-center py-8 px-6 bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="sports_kabaddi">sports_kabaddi</span>
<h1 class="text-primary font-black tracking-tighter uppercase text-2xl italic">BANTERBOT</h1>
</div>
</header>
<main class="relative w-full max-w-md min-h-screen flex flex-col px-6 pt-32 pb-12 bg-stadium-gradient">
<!-- Background Visual Hook -->
<div class="absolute top-0 left-0 w-full h-1/2 opacity-20 pointer-events-none overflow-hidden">
<div class="w-full h-full bg-cover bg-center" data-alt="ultra-modern sports stadium interior at night with dramatic neon blue and green light beams and hazy atmosphere" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCijwDKqxC9s7W15deI48WwALnCTrCu-YuRQDia9qrAJfsiopWfsqpJ8bKIZahJRfI7biv7WzGvL5yEDYHST-VnaRelBNZxsYaBxGz4_wfFX55WlEi3jbU6oI5pt2FCeVaVcAv1U3SeGg1I57x3-0lTNKKfaIIF79CRrDh6TBQ7olNSx19sJJ8NCYUv5GOuaHA0ZK01DqGEy4kuihXyIMCcfLdYcnkT4ctBg-AfCRww7NXgjbWt-sHN05Np96SMxuDCC_lJmNcV4wd7')"></div>
</div>
<!-- Hero Text -->
<section class="relative z-10 mb-10 text-center">
<h2 class="text-[3.5rem] leading-none font-black tracking-[-0.04em] text-on-surface uppercase mb-2">
                Welcome <br/>
<span class="text-primary">Back</span>
</h2>
<p class="text-on-surface-variant font-medium tracking-[0.05em] uppercase text-xs">
                To the Colosseum
            </p>
</section>
<!-- Login Form Container -->
<div class="relative z-10 glass-panel p-8 rounded-[1.5rem] border-t border-white/5 shadow-2xl flex flex-col gap-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="text-[0.75rem] font-bold uppercase tracking-[0.1em] text-on-surface-variant ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl" data-icon="alternate_email">alternate_email</span>
<input class="w-full bg-surface-container-highest text-on-surface rounded-xl py-4 pl-12 pr-4 border-none focus:ring-1 focus:ring-primary/40 transition-all outline-none placeholder:text-on-surface-variant/40" placeholder="Gladiator@banter.bot" type="email"/>
</div>
</div>
<!-- Secret Key Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="text-[0.75rem] font-bold uppercase tracking-[0.1em] text-on-surface-variant">Secret Key</label>
<a class="text-[0.7rem] font-bold text-primary/80 uppercase tracking-wider" href="#">Lost Key?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl" data-icon="vpn_key">vpn_key</span>
<input class="w-full bg-surface-container-highest text-on-surface rounded-xl py-4 pl-12 pr-4 border-none focus:ring-1 focus:ring-primary/40 transition-all outline-none placeholder:text-on-surface-variant/40" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- CTA -->
<button class="w-full py-5 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-black uppercase tracking-widest text-sm neon-glow-primary active:scale-95 transition-all flex items-center justify-center gap-2">
                Enter the Arena
                <span class="material-symbols-outlined text-xl" data-icon="bolt">bolt</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-px flex-1 bg-outline-variant/20"></div>
<span class="text-[0.7rem] font-bold text-on-surface-variant/50 uppercase tracking-widest">Or Synchronize</span>
<div class="h-px flex-1 bg-outline-variant/20"></div>
</div>
<!-- Social Logins -->
<!-- OUT OF SCOPE — IGNORAR: El botón de Discord no se implementa.
     Autenticación social (Discord, Google, Facebook) está fuera de scope MVP.
     Solo ASP.NET Core Identity. Ver PRD.md § Decisiones de Diseño — Resueltas, decisión #1. -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-bright py-4 rounded-xl transition-colors active:scale-95">
<span class="material-symbols-outlined text-[#5865F2]" data-icon="forum">forum</span>
<span class="text-[0.75rem] font-bold uppercase tracking-wider">Discord</span>
</button>
<button class="flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-bright py-4 rounded-xl transition-colors active:scale-95">
<span class="material-symbols-outlined text-[#24A1DE]" data-icon="send">send</span>
<span class="text-[0.75rem] font-bold uppercase tracking-wider">Telegram</span>
</button>
</div>
</div>
<!-- Footer Link -->
<footer class="mt-auto pt-10 text-center">
<p class="text-on-surface-variant text-sm font-medium">
                New to the bots? 
                <a class="text-secondary font-bold hover:underline" href="#">Recruit Now</a>
</p>
</footer>
</main>
<!-- Visual Accent: Live Pulse -->
<div class="fixed bottom-0 right-0 p-4 pointer-events-none opacity-40">
<div class="flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full">
<div class="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>
<span class="text-[0.65rem] font-black uppercase tracking-widest text-secondary">Arena Live</span>
</div>
</div>
</body></html>
